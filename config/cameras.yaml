# 摄像头配置 — 按标签(type)分配候选模块，按 modules 加载实际模块
# type（标签）: indoor_shelf / entrance / checkout
# modules: 该摄像头实际加载的分析模块（必须在标签候选池内，否则注册表校验警告）
#
# ⚠ source 的三种形态（这条注释是为了避免"服务器摄像头"被误当成普通文件播放）：
#   - 相对路径   仓库内的视频文件（演示用；服务端可信，但仍要求文件存在）
#   - rtsp://    真实门店里的网络摄像头（**生产形态**；容器/宿主机都要能网络可达该设备）
#   - webcam     服务端所在机器的**物理摄像头**（容器内做不到：WSL2 没有 /dev/video*）
# 改成 `source` 后重启后端生效；也可以用界面上的摄像头菜单临时切换，不改这里。
#
# 【本次精简说明】演示机上只有一台能真出画面，所以把另外两台**注释掉**（不是删除）：
#   下拉菜单只列出解析到的摄像头，注释掉就不会再出现"点了报错"的选项；
#   想恢复只需取消注释。三个机位的 type 在代码里都还在，随时能加回。
cameras:
  cam_in_01:
    name: "1号店内货架摄像头"
    type: indoor_shelf
    # 演示源：**30 秒 / 150 帧**（5fps）。
    # ⚠ 不要换回 `mmpose/demo/resources/demo.mp4` —— 那个只有 5 帧（≈1 秒），
    #   点开瞬间就"播放完毕"，看起来像坏了。
    # 放在 data/sources/ 而不是 data/videos/：后者是录制输出目录，受 DB_RECORD_KEEP_DAYS
    # 保留期（默认 30 天）按 mtime 清理，长期演示素材会被删掉。
    source: "data/sources/long_demo.mp4"
    modules: [shelf_heat, anomaly_detect, empty_shelf]

  # ---------------------------------------------------------------------------
  # 以下两台是**生产形态**的机位模板，本机没有对应硬件/设备，故注释掉。
  # 真实门店部署时取消注释并按实际设备改 source 即可（各机位的分析模块按 type 自动匹配）。
  # ---------------------------------------------------------------------------

