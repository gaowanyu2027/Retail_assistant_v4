<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：让 iPhone 刘海/圆角区域的 safe-area 变量可用
       （底部悬浮按钮用了 env(safe-area-inset-bottom)，安卓挖孔/手势条同样受益）
       interactive-widget=resizes-content：安卓 Chrome 弹出软键盘时**压缩布局**而不是盖住输入框 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>智能零售分析系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%234da6ff'/></svg>">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>[v-cloak]{display:none}</style>
  <!-- 登录态兜底（D3）：必须在 main.js 之前加载，才能在首个请求前接管 fetch -->
  <script src="/js/auth-guard.js"></script>
</head>
<body>
  <div id="app" v-cloak></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
