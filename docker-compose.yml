# ============================================================
# 智能零售分析系统 v4 — docker compose 编排
#
# 用法：
#   1) 准备环境变量：cp .env.example .env  （填入 dazuoye_api / mysql_root 等）
#   2) 启动：        docker compose up -d --build
#   3) 查看日志：    docker compose logs -f backend
#   4) 访问：        http://localhost:8000   （首次启动终端会打印 root 账号与随机密码）
#   5) 停止：        docker compose down
#
# ⚠ 从「docker run」迁移过来必读：
#   本编排复用既有的具名卷（mysql8_volume / qdrant-docker），数据不会丢，
#   但**同一个卷不能被两个容器同时挂载**——否则 MySQL 数据文件会损坏。
#   因此首次切换前必须先停掉旧的独立容器：
#       docker stop mysql-main qdrant
#   （注：本编排不发布 3306/6333，所以不是端口冲突问题，纯粹是共享卷的约束。）
#   保险起见可先备份：docker exec mysql-main mysqldump -uroot -p retail_assistant > backup.sql
#
# 架构说明（边缘 + 云端）：
#   本编排覆盖「云端/业务侧」——业务 API、Agent 问答、数据存储。
#   摄像头采集与 GPU 推理建议留在**边缘（本地）**：容器内直通摄像头/GPU
#   在 Windows 上尤其别扭，且原始视频流不该走公网。
#   因此容器内没有视频源时，系统会由「数据可信度门禁」明确提示
#   "视频源未启动，数据不可信"，而不会把 0 当成业务结论。
# ============================================================

name: retail-assistant

# ============================================================
# 日志轮转（全服务共用）
#
# 为什么必须配：项目里有 211 处 print() 全部走 stdout，Docker 默认的
# json-file 驱动**没有大小上限**——定时汇报（每 10 分钟一轮 LLM 摘要）+
# 销量目录扫描（每 60 秒）持续写日志，长期运行会把宿主机磁盘逐步吃满，
# 而磁盘满又会连带 MySQL 写入失败，属于典型的"平时无感、出事很惨"。
#
# 上限给到 50MB × 5 个文件（单服务约 250MB 封顶），足够排查问题。
# ============================================================
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ---------------- 业务后端（本项目） ----------------
  backend:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile
    image: retail-assistant:v4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        # 原来是 service_started（进程起来就往下走）→ 改成等**真正就绪**：
        # 否则 backend 会在 Qdrant 还没 ready 时就开始服务，首批语义检索失败降级
        # （几秒后自愈）—— 演示时表现为「刚开始问问题没有记忆」，很难联想到启动顺序。
        condition: service_healthy
    ports:
      - "8000:8000"
    # Docker Desktop（Windows/Mac）自带 host.docker.internal；
    # 但 Linux 上必须显式映射，否则上面 LANGFUSE_HOST 指向的宿主机地址解析不了。
    # 加上它对各平台都安全。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # 可选：从 .env.example 复制而来。没建 .env 时也不报错
      # （此时依赖 shell 里已有的环境变量或下面的 environment 默认值）
      - path: .env
        required: false
    environment:
      # 容器内用服务名做 DNS（compose 自动建网络），无需关心 IP
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      # ⚠ 数据库口令必须**在这里显式传给 backend**。
      # 常见误解：mysql 服务里写了 ${mysql_root}，backend 就自动有了——不会。
      # compose 的 ${...} 只是**宿主机侧的字符串替换**（用于 mysql 的
      # MYSQL_ROOT_PASSWORD），而变量要进容器，只能靠 environment: 或 env_file:。
      # 漏了这一行，后端会静默回退 SQLite：/api/health 依然 healthy、
      # 页面照常打开，但 MySQL 里的业务数据一条都读不到——属于"不报错的错配"。
      # 用 :? 让缺失时**直接报错**而不是悄悄降级。
      mysql_root: "${mysql_root:?请在 .env 或 shell 中设置 mysql_root}"
      # LLM Key 同理。用 :- 允许为空（无 Key 时问答降级，但服务仍可用）
      dazuoye_api: "${dazuoye_api:-}"
      # ---- 百度地图（竞品 / 商圈 / 地理编码 / 距离工具）----
      # 未设置时地图类工具会报错，但不影响其它功能，故用 :- 而非 :?
      baidu_map_ak: "${baidu_map_ak:-}"
      baidu_map_sk: "${baidu_map_sk:-}"
      # ---- Langfuse 可观测（Public + Secret 两个 Key 齐全才启用 Trace）----
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      # ⚠ 这里**不能**照搬宿主机的 http://localhost:3000：
      # 容器里的 localhost 是容器自己而非宿主机——实测 Connection refused，
      # 改成 host.docker.internal 后实测 200。
      # 若将来把 Langfuse 并入本 compose，应改为服务名（如 http://langfuse:3000）。
      LANGFUSE_HOST: "http://host.docker.internal:3000"
      # ⚠ 同理：Ollama 嵌入服务跑在宿主机上（本机直跑时是 127.0.0.1:11434），
      # 但容器里的 127.0.0.1 是容器自己——实测 refused。
      # 不设这一项，语义闸会 fail-open 关闭、向量召回退化为纯关键词（静默降级）。
      OLLAMA_EMBED_URL: "http://host.docker.internal:11434/api/embeddings"
      QDRANT_URL: http://qdrant:6333
      # 容器内没有摄像头 → 保持鉴权与销量投递目录默认开
      AUTH_ENABLED: "${AUTH_ENABLED:-1}"
      SALES_INBOX_ENABLED: "${SALES_INBOX_ENABLED:-1}"
    volumes:
      # 运行时数据：SQLite 回退库、鉴权库 auth.db、销量投递目录、日志
      - ./data:/app/data
      # 模型权重以只读方式挂载（不打进镜像）
      - ./yolo26n.pt:/app/yolo26n.pt:ro
      # 演示视频源：模块配置里 cam_in_01 的 source 就是它（`mmpose/demo/resources/demo.mp4`）。
      # ⚠ mmpose/ 被 .dockerignore 排除（体积大），所以镜像里**没有**这个文件 ——
      #   不挂载的话"服务器摄像头"在容器里永远打不开（实测 /app 下一个 mp4 都没有）。
      #   cv2 读文件不需要本机设备，因此这是容器里唯一能真正出画面的"服务器摄像头"来源。
      - ./mmpose/demo/resources/demo.mp4:/app/mmpose/demo/resources/demo.mp4:ro
      - ./best.pt:/app/best.pt:ro
      - ./mobilenetv3_fer_best.pth:/app/mobilenetv3_fer_best.pth:ro
      - ./all_models:/app/all_models:ro
      - ./sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01:/app/sherpa-onnx-kws-zipformer-wenetspeech-3.3M-2024-01-01:ro

  # ---------------- MySQL（业务数据持久化） ----------------
  mysql:
    logging: *default-logging
    # 台账 E6：钉到**实测在跑的版本**（宿主机 `SELECT VERSION()` → 8.0.46），
    # 不再用 8.0 这种会随时间漂移的浮动 tag（同一份 compose 今天和半年后构建出不同环境）。
    # `tag@digest` 形式：**拉取以 digest 为准**，既能一眼看出版本，又不依赖该 tag 是否还在，
    # 也不会被 tag 悄悄改指向（这才是真正可复现）。
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${mysql_root:?请在 .env 中设置 mysql_root}"
      MYSQL_DATABASE: retail_assistant
    # 端口默认不对外发布：backend 通过 compose 网络用服务名 `mysql` 直连，
    # 数据库无需暴露到宿主机（少一个攻击面）。
    # ⚠ 已按需打开（2026-09，Navicat 等 GUI 客户端连入）：
    #   **只绑 127.0.0.1**，不对局域网开放；用完可注释回去。
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql8_volume:/var/lib/mysql
    healthcheck:
      # ⚠ 用**真实查询**而不是 `mysqladmin ping`（E7）：
      # mysqladmin ping 只证明"进程还活着能应答"，**认证失败时它同样返回成功**，
      # 于是"口令配错了/账号被禁"这种最该被发现的故障会被判成健康。
      # 换成带凭据的 SELECT 1：认证过不了就直接 unhealthy。
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------- Qdrant（向量检索，Server 模式） ----------------
  qdrant:
    logging: *default-logging
    # 台账 E6：原来写 `qdrant/qdrant:latest` —— 那是**跨大版本浮动**，
    # 同一份 compose 在不同时间会拉到不同大版本，改动不可复现。
    # 这里钉到**容器内实测的版本**（HTTP `/` 返回 1.19.0）。
    # ⚠ 升级方向是安全的（Qdrant 会前向迁移存储），但**不要钉到比本地存储更旧的版本**：
    #   降级会直接拒绝启动。换版本前先确认在跑的是哪个：
    #   docker compose exec -T qdrant bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf "GET / HTTP/1.0\r\n\r\n" >&3; timeout 3 cat <&3' | tail -1
    # `tag@digest`：拉取以 digest 为准（不依赖 tag 是否还在、也不怕 tag 被改指向）
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    restart: unless-stopped
    # 向量库默认只在 compose 网络内被 backend 访问（`QDRANT_URL: http://qdrant:6333`）。
    # **但宿主模式（`python run.py`，本项目的主力演示方式）必须能连到它**：
    #   实测（2026-09-18 用户机）：qdrant 容器明明在跑，日志却一直刷
    #     [Vector] 向量检索失败，仅用关键词召回: [WinError 10061] 目标计算机积极拒绝
    #   原因就是端口没发布 —— 宿主进程连 127.0.0.1:6333 是空的。
    # 所以默认发布到 **127.0.0.1**（只监听本地，不暴露到局域网），
    # 让"宿主应用 + 容器数据库"这种混合用法也能用上向量召回。
    # 宿主机 6333 已被占用时（会 bind 失败）可注释掉这两行 —— 容器化模式不受影响。
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-docker:/qdrant/storage
    healthcheck:
      # ⚠ qdrant 镜像里**没有 curl / wget / python**，只有 bash（实测），
      #   所以用 bash 的 /dev/tcp 手发一个 HTTP 请求，并要求 `/readyz` 返回 **200**。
      #   为什么不只看"端口能连上"：那是 E7 批评过的"只证明进程活着"——
      #   `/readyz` 200 才代表"它已经能对外服务"（索引/存储就绪）。
      #   注意 printf 里的 `\\r\\n`：YAML 双引号会把 `\\` 还原成 `\`，
      #   shell 收到 `printf "GET /readyz HTTP/1.0\r\n\r\n"` → 输出真正的 CRLF。
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------- Redis（常驻：本项目的缓存层） ----------------
  # 定位：项目的**缓存层**，纳入 compose 统一管理（此前是游离的 `docker run` 容器）。
  #
  # ⚠ 代码当前**尚未读写 Redis**（缓存与限流仍是进程内实现）。接入请按此顺序，
  #   并且**先量再缓存**——用 benchmark/loadtest.py 测出 MySQL 实际负载后再决定缓存什么，
  #   否则会变成"因为零售系统都该有 Redis"的装饰品。
  #   ① 地图工具缓存：现有 _MAP_CACHE 是进程内 dict，满 500 条时 clear() 一次性全清
  #      （缓存雪崩）。Redis 的 per-key TTL 天然修掉，且直接省百度地图 API 配额。
  #   ② 热度/销量聚合查询结果：前端每 5 秒轮询多个接口，每个都打 MySQL 聚合；
  #      TTL 5~30 秒即可砍掉绝大部分重复查询。
  #   ③ embedding 缓存：hash(text) -> vector，省掉每次语义闸/向量召回的 Ollama 往返。
  #   不适合放进 Redis 的（别搬）：
  #     - 登录会话与限流：刻意存在独立的 SQLite 鉴权库，保证**业务库故障时管理员
  #       仍能登录**；搬进 Redis 会削弱该隔离，且 Redis 重启会丢掉限流状态。
  #     - 实时视频帧 / _active_camera：高频且体积大，进程内比走网络快。
  redis:
    logging: *default-logging
    # 台账 E6：钉到小版本（容器内 `redis-server --version` 实测 7.4.10）。
    # `tag@digest`：拉取以 digest 为准（digest 来自本地在跑的镜像，registry 里必然存在）
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command:
      # 作为缓存层要限制内存并用 LRU 淘汰，避免把宿主机内存吃光。
      # allkeys-lru 适用于纯缓存场景（没有必须永久保留的 key）。
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    # 不发布端口：backend 通过 compose 网络用服务名 `redis` 访问。
    # 需要从宿主机用 redis-cli / GUI 调试时再取消注释（已限 127.0.0.1）。
    # ports:
    #   - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  # 用 name: 固定真实卷名（不套用 compose 项目前缀）：
  # 既能在已有环境的卷上复用（数据保留），也能在全新环境自动创建
  mysql8_volume:
    name: mysql8_volume
  qdrant-docker:
    name: qdrant-docker
  redis_data:
    name: redis_data
