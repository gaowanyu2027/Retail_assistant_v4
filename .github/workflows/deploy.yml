# CD：部署 / 回滚（阿里云 ECS）
#
# ## 一、为什么是"推送到服务器"而不是"服务器拉取"
# 实测这台 ECS **访问不了 GitHub**（`git clone` 报
# `GnuTLS recv error (-110): The TLS connection was non-properly terminated.`），
# 服务器上 `git pull` 走不通。所以方向反过来：
# **GitHub runner 有代码 → 打包后 scp 推到服务器 → SSH 触发重建**。
# 服务器一次都不需要访问 GitHub。
#
# ## 二、版本与回滚（本文件的核心能力）
# 服务器上维护一份"版本仓库"：
#
#   /opt/releases/<sha8>.tar.gz   ← 每次部署过的**源码包**（保留最近 3 个）
#   /opt/releases/CURRENT         ← 当前版本 sha8
#   /opt/releases/PREVIOUS        ← 上一个版本 sha8（供"回退一步"）
#   retail-assistant:v4           ← 正在运行的后端镜像
#   retail-assistant:sha-<sha8>   ← 每个版本的后端镜像（保留最近 3 个）
#   retail-edge:v1                ← edge 网关镜像（有 edge 拓扑时）
#   retail-edge:sha-<sha8>        ← 每个版本的 edge 镜像（保留最近 3 个）
#
# 因此**回滚不需要重新构建**（2 核机器一次构建要 ~20 分钟）：
# 只要把旧镜像重新 tag 成 `retail-assistant:v4` + 把旧源码包解包回去 + 重建容器（秒级）。
#
# **拓扑随目标版本走**：源码包里带 `docker-compose.edge.yml` 就用"Go edge 对外
# 8000 + backend 只在 compose 内网"的拓扑；没有就退回 backend 直连拓扑（并清掉
# 目录里残留的覆盖文件、释放 8000）。`!reset` 需要 compose ≥ 2.20（服务器实测
# v5.5.1）；解析不了时**直接失败**而不是静默退回——避免"以为上了 edge 其实没有"。
#
#   回滚到指定版本：Actions → Run workflow → rollback_to 填 sha 前缀（如 59cc78c）
#   回退一步：      rollback_to 填 previous
#   正常部署：      rollback_to 留空
#
# ## 三、需要先配好的 3 个 Secrets（仓库 Settings → Secrets and variables → Actions）
#   DEPLOY_HOST     服务器公网 IP（如 182.92.31.32）
#   DEPLOY_USER     部署用户（**不要用 root**，见下）
#   DEPLOY_SSH_KEY  部署专用私钥（ed25519）；对应公钥加到该用户 ~/.ssh/authorized_keys
#
# ## 四、服务器侧一次性准备（最小权限；完整自查见 部署流程.md §3.15）
#   adduser --disabled-password --gecos "" deploy
#   usermod -aG docker deploy                      # 组权限在**新登录会话**才生效
#   install -d -m 700 -o deploy -g deploy /home/deploy/.ssh
#   chown -R deploy:deploy /opt/retail-assistant /opt/releases
#   rm -rf /tmp/retail-deploy                      # 以 root 跑过的 CD 留下的落地目录，deploy 写不进（见 部署流程.md 坑 23）
#   # 公钥**别手抄**成 echo '<部署公钥>'：占位符会被原样写进 authorized_keys（已踩两次，坑 19/23）。在本机用管道直送：
#   #   cat ~/.ssh/retail_deploy.pub | ssh root@<服务器IP> \
#   #     'cat > /tmp/k && install -m 600 -o deploy -g deploy /tmp/k /home/deploy/.ssh/authorized_keys && rm -f /tmp/k'
#   #   ssh -i ~/.ssh/retail_deploy deploy@<服务器IP> "whoami && id -nG && docker ps --format '{{.Names}}'"
#   # 加固：/etc/ssh/sshd_config → PermitRootLogin no（确认 deploy 能登录之后再改）
#
# ## 五、注意
# - **数据不参与回滚**：`data/`（auth.db）与 MySQL/Qdrant/Redis 卷原地继续用；
#   若某版本改过 schema，回滚镜像可能与新数据不兼容 → 回滚前先备份 `data/`。
# - 健康检查除 `/api/health/ready` 外，**还会检查首页是否引用了前端产物**
#   （避免"后端起来了但前端 404/空白"这种不算失败的情况）。

name: deploy

on:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: '回滚到往期版本：填 sha 前缀（如 59cc78c）或 previous；留空 = 正常部署当前 main'
        required: false
        default: ''
  # push:
  #   branches: [main]
  #   paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包源码（只含已跟踪文件，排除 .git 与本地文件）
        if: ${{ inputs.rollback_to == '' }}
        run: |
          # 用 git archive：只打包已跟踪文件（自动排除 .git / .env / data / 模型等），
          # 也避免 `tar -czf src.tar.gz .` 把输出写进被归档目录导致
          # "tar: .: file changed as we read it"（实测踩过，见 部署流程.md 坑 21）。
          git archive --format=tar.gz -o src.tar.gz HEAD
          ls -lh src.tar.gz
          tar -tzf src.tar.gz | wc -l

      - name: 上传到服务器
        if: ${{ inputs.rollback_to == '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: src.tar.gz
          target: /tmp/retail-deploy/
          overwrite: true

      - name: 部署或回滚
        uses: appleboy/ssh-action@v1
        env:
          SHA: ${{ github.sha }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 40m
          envs: SHA,ROLLBACK_TO
          script: |
            set -e
            cd /opt/retail-assistant
            REL=/opt/releases
            SHORT=$(echo "$SHA" | cut -c1-8)
            KEEP=3
            mkdir -p "$REL"

            health_ok() {
              curl -fsS http://127.0.0.1:8000/api/health/ready | grep -q '"status":"ok"'
            }
            front_ok() {
              curl -fsS http://127.0.0.1:8000/ | grep -q 'assets/index-'
            }
            wait_healthy() {
              for i in $(seq 20); do
                if health_ok; then return 0; fi
                sleep 5
              done
              return 1
            }
            prune_tags() {
              # 某仓库的 sha 标签：保留最近 KEEP 个
              docker images --format '{{.Repository}}:{{.Tag}} {{.CreatedAt}}' \
                | grep "^$1:sha-" | sort -k2 -r | tail -n +$((KEEP + 1)) \
                | awk '{print $1}' | xargs -r docker rmi -f >/dev/null 2>&1 || true
            }
            prune_old() {
              prune_tags retail-assistant
              prune_tags retail-edge
              # 源码包：同样只留最近 KEEP 个
              ls -1t "$REL"/*.tar.gz 2>/dev/null | tail -n +$((KEEP + 1)) | xargs -r rm -f || true
            }

            # 按"目标版本"选定拓扑，并让落地目录与目标版本一致。
            # 传源码包路径 = 按包内清单判定；传空串 = 以磁盘上刚解包的源码为准。
            # 设置两个全局量：COMPOSE（后续所有 compose 调用的前缀）与 HAS_EDGE。
            use_topology() {
              HAS_EDGE=0
              if [ -n "$1" ] && [ -f "$1" ]; then
                tar -tzf "$1" | grep -qx 'docker-compose.edge.yml' && HAS_EDGE=1 || true
              elif [ -f docker-compose.edge.yml ]; then
                HAS_EDGE=1
              fi
              if [ "$HAS_EDGE" = "1" ]; then
                if docker compose -f docker-compose.yml -f docker-compose.edge.yml config --quiet 2>/dev/null; then
                  COMPOSE="docker compose -f docker-compose.yml -f docker-compose.edge.yml"
                  echo "  拓扑：Go edge 对外 8000（backend 不发布端口）"
                else
                  echo "❌ 源码含 docker-compose.edge.yml，但本机 compose 解析不了它"
                  echo "   （ports: !reset 需 compose ≥ 2.20；实测服务器为 v5.5.1）"
                  exit 1
                fi
              else
                COMPOSE="docker compose -f docker-compose.yml"
                echo "  拓扑：backend 直连 8000"
                # 目标版本没有 edge：删掉目录里可能残留的覆盖文件（tar 解包只覆盖、
                # 不删除旧文件；残留会让"部署失败 → 自动回滚"回不到直连形态），
                # 并释放 8000（现役 edge 容器占着它，backend 直连绑不上端口）。
                rm -f docker-compose.edge.yml
                docker ps -aq -f label=com.docker.compose.service=edge | xargs -r docker rm -f || true
              fi
            }

            # ==================== 回滚分支 ====================
            if [ -n "$ROLLBACK_TO" ]; then
              TARGET="$ROLLBACK_TO"
              if [ "$TARGET" = "previous" ]; then
                TARGET=$(cat "$REL/PREVIOUS" 2>/dev/null || true)
              fi
              if [ -z "$TARGET" ]; then
                echo "❌ 没有可回滚的版本（$REL/PREVIOUS 不存在）；现有版本："
                ls -1 "$REL"/*.tar.gz 2>/dev/null || true
                exit 1
              fi
              IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E ":sha-$TARGET\$" | head -1 || true)
              if [ -z "$IMG" ]; then
                echo "❌ 找不到镜像 retail-assistant:sha-$TARGET；现有镜像："
                docker images | grep retail-assistant || true
                exit 1
              fi
              echo "▶ 回滚到 $TARGET（镜像 $IMG）"
              if [ -f "$REL/$TARGET.tar.gz" ]; then
                tar -xzf "$REL/$TARGET.tar.gz" -C /opt/retail-assistant
                echo "  源码已切回 $TARGET"
              else
                echo "  ⚠ 没有 $TARGET 的源码包（只回滚镜像；下次构建会变回新代码）"
              fi
              use_topology "$REL/$TARGET.tar.gz"
              CUR=$(cat "$REL/CURRENT" 2>/dev/null || true)
              [ -n "$CUR" ] && echo "$CUR" > "$REL/PREVIOUS"
              echo "$TARGET" > "$REL/CURRENT"
              docker tag "$IMG" retail-assistant:v4
              if [ "$HAS_EDGE" = "1" ] && docker image inspect "retail-edge:sha-$TARGET" >/dev/null 2>&1; then
                docker tag "retail-edge:sha-$TARGET" retail-edge:v1   # edge 镜像一起回退
              fi
              $COMPOSE up -d --force-recreate backend
              if [ "$HAS_EDGE" = "1" ]; then
                $COMPOSE up -d --force-recreate edge
              fi
              if wait_healthy; then
                echo "✅ 已回滚到 $TARGET"
                $COMPOSE ps
                exit 0
              fi
              echo "❌ 回滚后健康检查仍失败"
              $COMPOSE logs --tail=60 backend || true
              exit 1
            fi

            # ==================== 部署分支 ====================
            # 1) 存下本版本（源码包 + 记录版本指针）
            cp /tmp/retail-deploy/src.tar.gz "$REL/$SHORT.tar.gz"
            if [ -f "$REL/CURRENT" ]; then cp "$REL/CURRENT" "$REL/PREVIOUS"; fi
            echo "$SHORT" > "$REL/CURRENT"

            # 2) 解包覆盖（data/ 与模型文件不在包里，不受影响）
            tar -xzf /tmp/retail-deploy/src.tar.gz -C /opt/retail-assistant
            rm -f /tmp/retail-deploy/src.tar.gz

            # 2.5) 拓扑选择：以刚解包的源码为准（顺带清理与本版本不符的残留）
            use_topology ""

            # 3) 重建并启动
            $COMPOSE up -d --build

            # 4) 无论成败都打版本标签，便于事后回滚
            docker tag retail-assistant:v4 "retail-assistant:sha-$SHORT"
            if docker image inspect retail-edge:v1 >/dev/null 2>&1; then
              docker tag retail-edge:v1 "retail-edge:sha-$SHORT"
            fi

            # 5) 健康检查：后端 ready + 首页引用了前端产物（均经 8000，拓扑无关）
            if wait_healthy && front_ok; then
              echo "✅ 部署成功 $SHORT"
              prune_old
              $COMPOSE ps
              exit 0
            fi

            # 6) 失败 → 自动回滚到上一个版本
            echo "❌ 健康检查/前端可用性检查失败，尝试回滚到上一个版本"
            $COMPOSE logs --tail=80 backend || true
            PREV=$(cat "$REL/PREVIOUS" 2>/dev/null || true)
            if [ -n "$PREV" ] && docker images --format '{{.Tag}}' | grep -q "^sha-$PREV\$"; then
              if [ -f "$REL/$PREV.tar.gz" ]; then tar -xzf "$REL/$PREV.tar.gz" -C /opt/retail-assistant || true; fi
              use_topology "$REL/$PREV.tar.gz"
              echo "$PREV" > "$REL/CURRENT"
              docker tag "retail-assistant:sha-$PREV" retail-assistant:v4
              if [ "$HAS_EDGE" = "1" ] && docker image inspect "retail-edge:sha-$PREV" >/dev/null 2>&1; then
                docker tag "retail-edge:sha-$PREV" retail-edge:v1
              fi
              $COMPOSE up -d --force-recreate backend || true
              if [ "$HAS_EDGE" = "1" ]; then
                $COMPOSE up -d edge || true
              fi
              echo "已回滚到 $PREV"
            else
              echo "⚠ 没有可用的上一版本镜像，保持现状（需人工处理）"
            fi
            exit 1
