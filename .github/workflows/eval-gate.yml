# CI 门禁：push/PR 时跑 Agent 评测集，失败则拦截（回归保护）
# run_evals.py 已按"任一失败→退出码1"实现门禁。
#
# ⚠ 本文件曾经有一处**致命笔误**（已修，别再改回去）：
#   env 里写的是 `DEEPSEEK_API_KEY`，而**全项目读的是 `dazuoye_api`**
#   （见 config/settings.py）——全仓 grep `DEEPSEEK_API_KEY` 命中 0 次。
#   后果是 CI 里 LLM_API_KEY 恒为空，走 LLM 的用例必然失败或退化，
#   "评测门禁"名存实亡。此类"变量名不匹配"的静默失效本项目踩过多次
#   （另见 compose 漏传 mysql_root、容器内硬编码 127.0.0.1）。
#
# 使用前置（需要你手动做一次）：
#   仓库 Settings → Secrets and variables → Actions → New repository secret
#      名称：DAZUOYE_API     值：你的 DeepSeek Key
name: eval-gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ------------------------------------------------------------------
  # ① 单元 / 不变量测试（**秒级**，不依赖任何服务与密钥）
  #
  # 为什么单独一个 job、而不是塞进 eval：
  #   - eval 需要 MySQL 服务 + DeepSeek Key（secret），fork 来的 PR 拿不到 secret；
  #   - 单测**全离线**（守卫绕过清单、熔断/舱壁状态机、鉴权不变量用临时 SQLite、
  #     端口自检用临时 HTTP 服务），所以它能在任何环境拦住回归，跑得也快。
  #
  # ⚠ 依赖刻意只装最小集，**这个清单是实测出来的，不是猜的**：
  #   - fastapi        ← api/security.py:876 在模块级 `from fastapi import ...`
  #                      （test_auth.py 导它，所以必须有；曾漏装 → 整个测试文件被跳过）
  #   - httpx          ← vector_memory.py:11
  #   - qdrant_client  ← vector_memory.py:12（自动带 numpy/grpcio/protobuf/portalocker）
  #   **不需要**：torch（config/settings.py:47 包在 try/except ImportError 里，
  #   缺了就 DEVICE="cpu"，只有真正跑模型才要）、cv2、uvicorn（run.py 里是函数内 import）、
  #   redis、pymysql —— 装全套 requirements 要几分钟，而这一步十几秒。
  #   实测手法：用 meta_path 拦截器把上述包全部伪装成"未安装"（抛 ModuleNotFoundError），
  #   再跑 tests/run_tests.py → 33/33 通过（blocker 必须抛 ModuleNotFoundError，
  #   抛裸 ImportError 会穿透 fastapi 的 `except ModuleNotFoundError` 容错分支，造出假依赖）。
  #   若将来某个测试模块引入最小集以外的包，这里会**报导入失败直接失败**（fail-loud）。
  # ------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install minimal dependencies
        # 版本下界与 requirements.txt 保持一致，避免与生产环境漂移
        run: |
          python -m pip install --upgrade pip
          pip install "fastapi>=0.100.0" "httpx>=0.27" "qdrant-client>=1.19.0"

      - name: Run unit tests
        # 零额外依赖（宿主/CI 不装 pytest 也能跑；装了 pytest 也能跑同一批用例）
        run: python tests/run_tests.py

  eval:
    runs-on: ubuntu-latest
    # 单测先过再跑评测：省 CI 时间，也让"基础设施级回归"先于"LLM 用例失败"暴露
    needs: unit

    services:
      # ⚠ 必须有：evals/run_evals.py 的 query_tool_logs() 是**直接**连 MySQL 的
      # （不过 SQLite 回退），evaluate() 每个用例都会调用它。
      # 没有这个服务，CI 报的是连接错误，而不是"评测失败"——两者含义完全不同。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpw
          MYSQL_DATABASE: retail_assistant
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run evaluation gate
        env:
          # 变量名必须与代码一致（见文件头的说明）
          dazuoye_api: ${{ secrets.DAZUOYE_API }}
          # CI 里的 MySQL 用一次性口令，仅本 job 生命周期有效
          mysql_root: testpw
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
        run: |
          python evals/run_evals.py
        # 退出码 0=通过，1=有失败用例（门禁拦截），2=异常
